<div class="kpi-container">

 <div
  class="kpi-card"
  [class.kpi-card-recaudo]="kpi.title === 'Recaudo del período'"
  *ngFor="let kpi of kpis"
>

    <div class="kpi-title">
      {{ kpi.title }}
    </div>

    <div
  class="kpi-value"
  [class.kpi-value-recaudo]="kpi.title === 'Recaudo del período'"
>
  {{ kpi.value }}
</div>

    <div class="kpi-change">

  <span class="kpi-percentage">
    {{ kpi.changePercentage }}%
  </span>

  <span class="kpi-period">
    {{ kpi.periodText }}
  </span>


</div>

  </div>

</div>
