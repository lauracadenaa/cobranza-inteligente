
<!-- ================================================== -->
<!-- SIDEBAR PRINCIPAL -->
<!-- ================================================== -->

<aside class="sidebar" [class.contraido]="sidebarContraido">

  <!-- ================================================== -->
  <!-- LOGO Y BOTÓN HOVER -->
  <!-- ================================================== -->

  <div class="sidebar-logo">

    <!-- BOTÓN PARA CONTRAER Y EXPANDIR -->
    <button
      type="button"
      class="sidebar-toggle"
      (click)="alternarSidebar()"
      [attr.aria-label]="sidebarContraido ? 'Expandir menú' : 'Contraer menú'"
      [title]="sidebarContraido ? 'Expandir menú' : 'Contraer menú'"
    >
<app-icono [nombre]="sidebarContraido ? 'chevron-right' : 'panel-left'" [tamano]="18" class="toggle-icon"></app-icono>
    </button>

    <div class="logo">

      <!-- LOGO BV: SIEMPRE VISIBLE -->
      <div class="logo-bv">
        BV
      </div>

      <!-- TEXTO BANKVISION: SOLO CUANDO ESTÁ EXPANDIDO -->
      <span class="logo-text" *ngIf="!sidebarContraido">
        BankVision
      </span>

    </div>

  </div>


  <!-- ================================================== -->
  <!-- OPCIONES DEL MENÚ -->
  <!-- ================================================== -->

  <nav class="menu">

    <!-- INICIO -->
    <a
      href="#"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Inicio'"
      title="Inicio"
      (click)="seleccionarOpcion('Inicio'); $event.preventDefault()"
    >
      <app-icono nombre="house" [tamano]="18" class="menu-icon"></app-icono>
      <span *ngIf="!sidebarContraido">Inicio</span>
    </a>


    <!-- CARTERA -->
    <a
      href="#"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Cartera'"
      title="Cartera"
      (click)="seleccionarOpcion('Cartera'); $event.preventDefault()"
    >
      <app-icono nombre="wallet-minimal" [tamano]="18" class="menu-icon"></app-icono>
      <span *ngIf="!sidebarContraido">Cartera</span>
    </a>


    <!-- GESTIÓN DE CASOS -->
    <a
      href="#"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Gestión de casos'"
      title="Gestión de casos"
      (click)="seleccionarOpcion('Gestión de casos'); $event.preventDefault()"
    >
      <app-icono nombre="clipboard-list" [tamano]="18" class="menu-icon"></app-icono>
      <span *ngIf="!sidebarContraido">Gestión de casos</span>
    </a>


   
<!-- MOTOR IA -->
<a
  href="/motor-ia"
  class="menu-item"
  [class.active]="opcionSeleccionada === 'Motor IA y Scoring'"
  title="Motor IA y Scoring"
  (click)="seleccionarOpcion('Motor IA y Scoring'); $event.preventDefault()"
>
  <app-icono nombre="sparkles" [tamano]="18" class="menu-icon"></app-icono>

  <span *ngIf="!sidebarContraido">
    Motor IA y Scoring
  </span>
</a>


    <!-- ESTRATEGIAS -->
    <a
      href="#"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Estrategias'"
      title="Estrategias"
      (click)="seleccionarOpcion('Estrategias'); $event.preventDefault()"
    >
      <app-icono nombre="sliders-horizontal" [tamano]="18" class="menu-icon"></app-icono>
      <span *ngIf="!sidebarContraido">Estrategias</span>
    </a>


    <!-- LINKS Y PAGOS -->
    <a
      href="/links-pagos"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Pagos y recaudos'"
      title="Links y pagos"
      (click)="seleccionarOpcion('Pagos y recaudos'); $event.preventDefault()"
    >
      <app-icono nombre="hand-coins" [tamano]="18" class="menu-icon"></app-icono>

      <span *ngIf="!sidebarContraido">
        Links y pagos
      </span>
    </a>

    <!-- REPORTES Y AUDITORÍA -->
    <a
      href="/reportes-auditoria"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Reportes y auditoría'"
      title="Reportes y auditoría"
      (click)="seleccionarOpcion('Reportes y auditoría'); $event.preventDefault()"
    >
      <app-icono nombre="chart-column-big" [tamano]="18" class="menu-icon"></app-icono>

      <span *ngIf="!sidebarContraido">
        Reportes y auditoría
      </span>
    </a>


    <!-- ADMINISTRACIÓN -->
    <a
      href="/administracion"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Administración'"
      title="Administración"
      (click)="seleccionarOpcion('Administración'); $event.preventDefault()"
    >
      <app-icono nombre="settings" [tamano]="18" class="menu-icon"></app-icono>
      <span *ngIf="!sidebarContraido">Administración</span>
    </a>

  </nav>
