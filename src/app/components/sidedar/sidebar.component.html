<!-- ================================================== -->
<!-- SIDEBAR PRINCIPAL -->
<!-- ================================================== -->

<aside class="sidebar">

  <!-- ================================================== -->
  <!-- LOGO -->
  <!-- ================================================== -->

  <div class="sidebar-logo">

    <div class="logo">

      <!-- CUADRO BV -->
      <div class="logo-bv">
        BV
      </div>

      <!-- NOMBRE -->
      <span class="logo-text">
        BankVision
      </span>

    </div>

  </div>


  <!-- ================================================== -->
  <!-- OPCIONES DEL MENÚ -->
  <!-- ================================================== -->

  <nav class="menu">

    <!-- INICIO -->
    <a
      href="#"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Inicio'"
      (click)="seleccionarOpcion('Inicio'); $event.preventDefault()"
    >
      <span>Inicio</span>
    </a>


    <!-- CARTERA -->
    <a
      href="#"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Cartera'"
      (click)="seleccionarOpcion('Cartera'); $event.preventDefault()"
    >
      <span>Cartera</span>
    </a>


    <!-- GESTIÓN DE CASOS -->
    <a
      href="#"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Gestión de casos'"
      (click)="seleccionarOpcion('Gestión de casos'); $event.preventDefault()"
    >
      <span>Gestión de casos</span>
    </a>


    <!-- MOTOR IA Y SCORING -->
    <a
      href="#"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Motor IA y Scoring'"
      (click)="seleccionarOpcion('Motor IA y Scoring'); $event.preventDefault()"
    >
      <span>Motor IA y Scoring</span>
    </a>


    <!-- ESTRATEGIAS -->
    <a
      href="#"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Estrategias'"
      (click)="seleccionarOpcion('Estrategias'); $event.preventDefault()"
    >
      <span>Estrategias</span>
    </a>


    <!-- PAGOS Y RECAUDOS -->
    <a
      href="#"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Pagos y recaudos'"
      (click)="seleccionarOpcion('Pagos y recaudos'); $event.preventDefault()"
    >
      <span>Pagos y recaudos</span>
    </a>


    <!-- REPORTES Y AUDITORÍA -->
    <a
      href="#"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Reportes y auditoría'"
      (click)="seleccionarOpcion('Reportes y auditoría'); $event.preventDefault()"
    >
      <span>Reportes y auditoría</span>
    </a>


    <!-- ADMINISTRACIÓN -->
    <a
      href="#"
      class="menu-item"
      [class.active]="opcionSeleccionada === 'Administración'"
      (click)="seleccionarOpcion('Administración'); $event.preventDefault()"
    >
      <span>Administración</span>
    </a>

      </nav>

  <!-- ================================================== -->
  <!-- BOTÓN CERRAR SESIÓN -->
  <!-- ================================================== -->

  <button
    type="button"
    class="logout-button"
    (click)="cerrarSesion()"
  >
    <span class="logout-icon">
      <i class="bi bi-box-arrow-right"></i>
    </span>

    <span>Cerrar sesión</span>
  </button>

</aside>

<!-- ================================================== -->
<!-- MODAL CONFIRMAR CIERRE DE SESIÓN -->
<!-- ================================================== -->

<div class="logout-modal-overlay" *ngIf="mostrarModalCerrarSesion">

  <div class="logout-modal">

    <!-- BOTÓN PARA CERRAR EL MODAL -->
<button
  type="button"
  class="logout-modal-close"
  (click)="cancelarCerrarSesion()"
  aria-label="Cerrar ventana">

  <i class="bi bi-x-lg"></i>

</button>

    <!-- ICONO DE SALIDA -->
    <div class="logout-modal-icon">
      <img src="imagenes/Cerrar-sesion.png" alt="Cerrar Sesión">
    </div>

    <!-- TÍTULO -->
    <h2>¿Cerrar sesión?</h2>

    <!-- MENSAJE -->
    <p>
      Tendrás que iniciar sesión nuevamente para acceder nuevamente.
    </p>

    <!-- BOTONES -->
    <div class="logout-modal-buttons">

      <button
        type="button"
        class="btn-seguir"
        (click)="cancelarCerrarSesion()">
        Seguir navegando
      </button>

      <button
        type="button"
        class="btn-cerrar"
        (click)="confirmarCerrarSesion()">
        Cerrar sesión
      </button>

    </div>

  </div>

</div>
