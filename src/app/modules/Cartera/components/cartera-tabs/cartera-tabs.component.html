
<div class="cartera-tabs">

  <button
    *ngFor="let pestana of pestanas"
    type="button"
    class="tab"
    [class.active]="pestanaActiva === pestana"
    (click)="seleccionarPestana(pestana)">

    {{ pestana }}

  </button>

  <!-- Espacio a la derecha para botones extra (ej. Sincronizar con CORE) -->
  <div class="tabs-extra">
    <ng-content></ng-content>
  </div>

</div>
