<section class="kpi-container">

  <div class="kpi-card" *ngFor="let kpi of kpisActuales">

    <div class="kpi-icon">
      <app-icono [nombre]="kpi.imagen" [tamano]="20" [style.color]="kpi.color"></app-icono>
    </div>

    <div class="kpi-title">
      {{ kpi.titulo }}
    </div>

    <div class="kpi-value">
      {{ kpi.valor }}
    </div>

    <div class="kpi-change" *ngIf="kpi.porcentaje">
      <span class="kpi-percentage">
        {{ kpi.porcentaje }}
      </span>

      <span class="kpi-period">
        {{ kpi.periodo }}
      </span>
    </div>

  </div>

</section>
